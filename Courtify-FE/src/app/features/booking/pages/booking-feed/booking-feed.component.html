<div class="booking-container">
  <!-- BANNER HERO -->
  <app-banner
    title="Your Next Match Starts Here"
    subtitle="Choose from top-rated badminton, basketball, and tennis courts near you. Instant confirmation with zero hassle."
  ></app-banner>

  <!-- BOOKING SECTION -->
  <section class="booking-section">
    <h1 class="booking-title">Active Bookings</h1>
    <div class="booking-grid">
      @for (booking of activeBookings; track booking.id) {
        <app-booking-card
          [booking]="booking"
          [route]="APP_ROUTES.BOOK"
          illustrationImage="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=2340&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        ></app-booking-card>
      }
    </div>
  </section>
</div>
